# pyorica reference experiment config
#
# ORICA parameters match the original MATLAB ORICA reference implementation
# (ORICA_final_no_print_quick30.py / iclabel_2 experiment).
#
# Key difference from PipelineConfig defaults:
#   orica_lambda_0:  0.00133 (vs 0.995) — initial forgetting factor ≈ steady-state λ,
#                             giving constant slow adaptation throughout the session.
#   orica_tau_const: 3.0     (vs inf)   — steady-state λ = 1 - exp(-1/(3×sfreq)) ≈ 0.00133
#   orica_block_size_white/ica: 32      (vs 8)
#
# Usage:
#   export PYORICA_NCTU_DATA=/path/to/dataset_2019_TBME
#   python benchmarks/run_all_subjects.py --config benchmarks/config/reference.yaml

# ── IIR bandpass filter ──────────────────────────────────────────────────────
iir_l_freq: 1.0             # lower cutoff (Hz)
iir_h_freq: 50.0            # upper cutoff (Hz)
iir_order: 4                # filter order

# ── ASR (Artifact Subspace Reconstruction) ───────────────────────────────────
asr_backend: "asrpy"        # "asrpy" (default) or "meegkit"
asr_cutoff: 20.0            # SD multiplier; higher = less aggressive cleaning
asr_calibration_seconds: 120.0  # seconds of IIR-filtered session lead-in used to calibrate ASR

# ── ORICA (Online Recursive ICA) ─────────────────────────────────────────────
orica_ff_profile: "cooling"     # forgetting factor schedule
orica_block_size_white: 32      # samples per RLS whitening update
orica_block_size_ica: 32        # samples per ICA weight update
orica_lambda_0: 0.00133         # initial forgetting factor λ₀; equals steady-state λ
orica_gamma: 0.6                # cooling decay rate
orica_num_subgaussian: 0        # ICs assumed sub-Gaussian (0 = all super-Gaussian)
orica_tau_const: 3.0            # local stationarity window (seconds); steady-state λ = 1-exp(-1/(tau*sfreq))

# ── ICLabel artifact classifier ───────────────────────────────────────────────
icalabel_threshold: 0.7         # probability threshold ∈ [0, 1]
icalabel_apply_car_bandpass: true  # apply CAR + 1-100 Hz bandpass before classifying
                                    # (slightly improves accuracy — fewer brain ICs
                                    # reduced as artifacts — at the cost of extra
                                    # per-chunk bandpass-filter compute)
classify_interval_s: 0          # seconds between ICLabel runs (0 = every chunk)

# ── Benchmark simulation ──────────────────────────────────────────────────────
chunk_size: 1000                 # samples per pipeline step in simulated real-time
